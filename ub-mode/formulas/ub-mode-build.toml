description = """
Default Gas City build workflow with Uncle Bob's ub-mode applied to design and implementation."""
formula = "ub-mode-build"
version = 1
extends = ["build-basic"]
target_required = true

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "ub-mode-build"
description = "Run the build-basic full-lifecycle build, applying ub-mode discipline to the design and implementation steps."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars.ub_mode_formula]
description = "This formula's id, recorded in the plan artifact front matter."
default = "ub-mode-build"

[[steps]]
id = "plan"
title = "Write implementation plan"
needs = ["requirements"]
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description_file = "../assets/workflows/ub-mode-build/plan.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "implement"
title = "Drain build implementation"
needs = ["decompose"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/ub-mode-build/implement.md"

[steps.drain]
context = "separate"
formula = "do-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Drain build implementation in one shared session"
needs = ["decompose"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/ub-mode-build/implement-same-session.md"

[steps.drain]
context = "shared"
formula = "do-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true
